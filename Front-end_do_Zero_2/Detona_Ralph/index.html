<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<!-- * links externos -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
			rel="stylesheet"
		/>

		<!-- * informações do projeto -->
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Detona Ralph</title>

		<!-- * links internos -->
		<link rel="stylesheet" href="src/styles/reset.css" />
        <link rel="stylesheet" href="src/styles/style.css">
	</head>
	<body>
        <main class="container">
            <section class="pop-up" id="pop-up_start">
                <h1 class="pop-up_title">Detona Ralph</h1>
                <h2>Selecione a duração</h2>
                <div class="pop-up_button-group">
                    <button onclick="setTime(15)">15s</button>
                    <button onclick="setTime(30)">30s</button>
                    <button onclick="setTime(45)">45s</button>
                    <button onclick="setTime(60)">60s</button>
                </div>
                <p>Tempo selecionado: <span id="pop-up_time-span">30</span> segundos</p>
                <button class="pop-up_start-game" onclick="initialize()">Jogar</button>
            </section>
            <section class="menu">
                <div class="menu_time">
                    <h2>Tempo restante:</h2>
                    <h2 id="time-value">0</h2>
                </div>
                <div class="menu_score">
                    <h2>Pontuação:</h2>
                    <h2 id="score-value">0</h2>
                </div>
                <div class="menu_lives">
                    <img src="src/img/player.png" height="40px" alt="red heart">
                    <h2>x<span id="lives-value">3</span></h2>
                </div>
            </section>
            <section class="panel">
                <div class="panel_row">
                    <div class="panel_square" id="square--1"></div>
                    <div class="panel_square" id="square--2"></div>
                    <div class="panel_square" id="square--3"></div>
                </div>
                <div class="panel_row">
                    <div class="panel_square" id="square--4"></div>
                    <div class="panel_square" id="square--5"></div>
                    <div class="panel_square" id="square--6"></div>
                </div>
                <div class="panel_row">
                    <div class="panel_square" id="square--7"></div>
                    <div class="panel_square" id="square--8"></div>
                    <div class="panel_square" id="square--9"></div>
                </div>
            </section>
            <section style="display: none;" class="pop-up" id="pop-up_game-over">
                <h1 class="pop-up_title">Fim de jogo!</h1>
                <h2>Sua pontuação final foi <span id="final-score">0</span></h2>
                <button class="pop-up_start-game" onclick="openStartPopup()">Jogar novamente</button>
            </section>
        </main>
        <script defer src="src/script/engine.js"></script>
    </body>
</html>
